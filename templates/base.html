<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{% block title %}QuizMaster{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<nav class="navbar">

    <a href="/" class="brand">
        QuizMaster
    </a>

    <div class="nav-links">
        <a href="/">Dashboard</a>
        <a href="/manage">Manage</a>

        <a href="/create" class="nav-create">
            + Create Quiz
        </a>
    </div>

</nav>

<main class="main-content">

    {% block content %}{% endblock %}

</main>

<footer class="footer">
    <p>QuizMaster</p>
    <span>Running commit: {{ commit }}</span>
</footer>

</body>
</html>
